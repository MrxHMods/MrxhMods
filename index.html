<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MrxH Mods - Premium Mod Menu Games</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ========== RESET & VARIABLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-primary: #00ff88;
            --neon-primary-dark: #00cc6a;
            --neon-glow: rgba(0, 255, 136, 0.3);
            --neon-glow-strong: rgba(0, 255, 136, 0.5);
            --bg-dark: #0a0c14;
            --bg-card: rgba(10, 12, 20, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #a0a8c0;
            --border-neon: rgba(0, 255, 136, 0.3);
            --shadow: 0 10px 15px rgba(0, 0, 0, 0.4), 0 0 30px var(--neon-glow);
            --gradient: linear-gradient(135deg, var(--neon-primary) 0%, var(--neon-primary-dark) 100%);
            --warning: #ffaa00;
            --danger: #ff4757;
            --update-glow: rgba(0, 255, 200, 0.6);
        }

        /* ========== GLOBAL STYLES ========== */
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
            color: var(--text-primary);
            line-height: 1.5;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.15) 0%, transparent 35%),
                radial-gradient(circle at 40% 80%, rgba(255, 0, 255, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .container::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        /* ========== HEADER ========== */
        .header {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            border: 1px solid var(--border-neon);
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(0, 255, 136, 0.1) 50%, transparent 70%);
            animation: neon-shine 8s linear infinite;
        }

        @keyframes neon-shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: var(--gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-dark);
            font-size: 24px;
            box-shadow: 0 0 20px var(--neon-glow-strong);
            border: 1px solid var(--neon-primary);
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px var(--neon-glow);
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .date-badge {
            background: rgba(0, 255, 136, 0.1);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-neon);
            backdrop-filter: blur(10px);
        }

        /* ========== PROFILE CARD ========== */
        .profile-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
            border: 1px solid var(--border-neon);
            position: relative;
        }

        .profile-avatar {
            position: relative;
        }

        .profile-avatar img {
            width: 120px;
            height: 120px;
            border-radius: 30px;
            object-fit: cover;
            border: 3px solid var(--neon-primary);
            box-shadow: 0 0 30px var(--neon-glow-strong);
        }

        .verified {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: var(--neon-primary);
            color: var(--bg-dark);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 2px solid var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-glow-strong);
            animation: verified-pulse 2s infinite;
        }

        @keyframes verified-pulse {
            0% { box-shadow: 0 0 20px var(--neon-glow-strong); }
            50% { box-shadow: 0 0 40px var(--neon-primary); }
            100% { box-shadow: 0 0 20px var(--neon-glow-strong); }
        }

        .profile-info h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -1px;
            text-shadow: 0 0 15px var(--neon-glow);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 16px;
            max-width: 500px;
        }

        .profile-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 136, 0.1);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid var(--border-neon);
        }

        /* ========== SEARCH SECTION ========== */
        .search-section {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 32px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid var(--border-neon);
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-box .material-symbols-outlined {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-primary);
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border: 1px solid var(--border-neon);
            border-radius: 50px;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--neon-primary);
            box-shadow: 0 0 30px var(--neon-glow);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-neon);
            border-radius: 40px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn.active {
            background: var(--neon-primary);
            color: var(--bg-dark);
            border-color: var(--neon-primary);
            box-shadow: 0 0 20px var(--neon-glow-strong);
        }

        /* ========== SECTION TITLE ========== */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .section-title-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title-left .material-symbols-outlined {
            font-size: 28px;
            color: var(--neon-primary);
            background: rgba(0, 255, 136, 0.1);
            padding: 8px;
            border-radius: 14px;
        }

        .section-title-left h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .section-title-left span {
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: var(--neon-primary);
        }

        /* ========== APK GRID ========== */
        .apk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .apk-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--border-neon);
            display: flex;
            flex-direction: column;
            animation: cardFadeIn 0.4s ease;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .apk-card.recent-update {
            border: 2px solid var(--neon-primary);
            box-shadow: 0 0 40px var(--update-glow);
            animation: updatePulse 1s ease;
        }

        @keyframes updatePulse {
            0% { box-shadow: 0 0 0 0 var(--update-glow); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .apk-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-primary);
            box-shadow: 0 15px 35px rgba(0, 255, 136, 0.2), 0 0 40px var(--neon-glow);
        }

        .apk-header {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .apk-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            object-fit: cover;
            border: 2px solid var(--neon-primary);
            padding: 2px;
        }

        .apk-info {
            flex: 1;
        }

        .apk-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .apk-version {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            color: var(--neon-primary);
            border: 1px solid var(--border-neon);
        }

        .apk-description {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.6;
            flex: 1;
        }

        .apk-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            padding: 12px 0;
            border-top: 1px solid var(--border-neon);
            border-bottom: 1px solid var(--border-neon);
        }

        .apk-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .download-count {
            color: var(--neon-primary) !important;
            font-weight: 600;
        }

        .update-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 255, 136, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: var(--neon-primary);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            background: transparent;
            color: var(--neon-primary);
            text-decoration: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            border: 1px solid var(--neon-primary);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
        }

        .download-btn:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 5px 30px var(--neon-glow-strong);
            transform: translateY(-2px);
        }

        /* ========== NEWS GRID ========== */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .news-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--border-neon);
            cursor: pointer;
            position: relative;
        }

        .news-card:hover {
            transform: translateY(-4px);
            border-color: var(--neon-primary);
            box-shadow: 0 15px 35px rgba(0, 255, 136, 0.2);
        }

        .news-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 170, 0, 0.1);
            color: var(--warning);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--warning);
        }

        .news-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-right: 80px;
        }

        .news-detail {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .news-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border-neon);
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-primary);
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border-neon);
        }

        /* ========== TOAST NOTIFICATION ========== */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            padding: 16px 24px;
            border-radius: 50px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            border: 1px solid var(--neon-primary);
            animation: neon-slideIn 0.3s ease;
        }

        @keyframes neon-slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ========== FLOATING BUTTON ========== */
        .fab {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 56px;
            height: 56px;
            background: transparent;
            color: var(--neon-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--neon-primary);
            box-shadow: 0 0 30px var(--neon-glow);
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .fab:hover {
            transform: scale(1.1);
            background: rgba(0, 255, 136, 0.1);
        }

        /* ========== MODAL ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 2px solid var(--neon-primary);
            border-radius: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 50px var(--neon-glow-strong);
        }

        .modal-header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--border-neon);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg-card);
        }

        .modal-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-neon);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 71, 87, 0.2);
            border-color: var(--danger);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        .modal-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 2px solid var(--neon-primary);
        }

        .modal-date {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 136, 0.1);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            color: var(--neon-primary);
            margin-bottom: 24px;
        }

        .modal-detail {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 30px;
            white-space: pre-wrap;
        }

        .modal-link-container {
            text-align: center;
        }

        .modal-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            background: transparent;
            color: var(--neon-primary);
            text-decoration: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            border: 2px solid var(--neon-primary);
            transition: all 0.3s;
        }

        .modal-link:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: translateY(-2px);
        }

        /* ========== LOADING SKELETON ========== */
        .loading-skeleton {
            background: var(--bg-card);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid var(--border-neon);
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(0, 255, 136, 0.05) 25%, rgba(0, 255, 136, 0.1) 50%, rgba(0, 255, 136, 0.05) 75%);
            background-size: 200% 100%;
            animation: neon-loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes neon-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-icon { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 16px; }
        .skeleton-title { height: 20px; width: 60%; margin-bottom: 8px; }
        .skeleton-text { height: 14px; width: 100%; margin-bottom: 8px; }
        .skeleton-btn { height: 44px; width: 100%; border-radius: 50px; margin-top: 16px; }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: 30px;
            border: 1px solid var(--border-neon);
        }

        .empty-state .material-symbols-outlined {
            font-size: 64px;
            color: var(--neon-primary);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
        }

        /* ========== FOOTER ========== */
        .footer {
            text-align: center;
            padding: 32px 0;
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid var(--border-neon);
            margin-top: 32px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .apk-grid, .news-grid { grid-template-columns: 1fr; }
            .profile-card { flex-direction: column; text-align: center; }
            .profile-info h1 { justify-content: center; }
            .profile-stats { justify-content: center; }
            .search-section { flex-direction: column; }
            .filter-buttons { width: 100%; justify-content: center; }
            .toast { left: 16px; right: 16px; bottom: 80px; }
            .fab { bottom: 16px; left: 16px; }
            .modal-header h2 { font-size: 18px; }
            .modal-body { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo">
                    <span class="material-symbols-outlined">apk_install</span>
                </div>
                <div class="header-title">
                    <h1>MrxH Mods</h1>
                    <p>Mod Menu Games | Real-time Updates</p>
                </div>
            </div>
            <div class="date-badge">
                <span class="material-symbols-outlined">calendar_today</span>
                <span id="currentDate"></span>
            </div>
        </div>

        <!-- PROFILE CARD -->
        <div class="profile-card">
            <div class="profile-avatar">
                <img src="https://via.placeholder.com/120" alt="Profile" id="profileImage">
                <div class="verified" id="verifiedBadge" style="display: none;">
                    <span class="material-symbols-outlined">verified</span>
                </div>
            </div>
            <div class="profile-info">
                <h1 id="profileName">Loading...</h1>
                <p class="profile-bio" id="profileBio"></p>
                <div class="profile-stats">
                    <div class="stat-item">
                        <span class="material-symbols-outlined">update</span>
                        <span id="lastUpdate">Real-time</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- TOAST -->
        <div id="toast" class="toast"></div>

        <!-- SEARCH & FILTER -->
        <div class="search-section">
            <div class="search-box">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="searchInput" placeholder="Search APK by name..." onkeyup="filterItems()">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterByCategory('all')">
                    <span class="material-symbols-outlined">apps</span> All
                </button>
                <button class="filter-btn" onclick="filterByCategory('popular')">
                    <span class="material-symbols-outlined">trending_up</span> Popular
                </button>
                <button class="filter-btn" onclick="filterByCategory('new')">
                    <span class="material-symbols-outlined">fiber_new</span> New
                </button>
            </div>
        </div>

        <!-- APK SECTION -->
        <div class="section-title">
            <div class="section-title-left">
                <span class="material-symbols-outlined">apps</span>
                <h2>Available APKs</h2>
                <span id="apkCount">0</span>
            </div>
            <div class="section-title-right">
                <span class="material-symbols-outlined">sort</span>
                <span id="sortInfo">Latest edits first</span>
            </div>
        </div>
        <div class="apk-grid" id="linksContainer">
            <div class="loading-skeleton">
                <div class="skeleton skeleton-icon"></div>
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 80%;"></div>
                <div class="skeleton skeleton-btn"></div>
            </div>
            <div class="loading-skeleton">
                <div class="skeleton skeleton-icon"></div>
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 80%;"></div>
                <div class="skeleton skeleton-btn"></div>
            </div>
        </div>

        <!-- NEWS SECTION -->
        <div class="section-title">
            <div class="section-title-left">
                <span class="material-symbols-outlined">newspaper</span>
                <h2>Latest Updates</h2>
                <span id="newsCount">0</span>
            </div>
        </div>
        <div class="news-grid" id="infoPostsContainer">
            <div class="loading-skeleton">
                <div class="skeleton skeleton-title" style="width: 80%;"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 60%;"></div>
            </div>
            <div class="loading-skeleton">
                <div class="skeleton skeleton-title" style="width: 80%;"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 60%;"></div>
            </div>
        </div>

        <!-- FLOATING BUTTON -->
        <button class="fab" onclick="scrollToTop()">
            <span class="material-symbols-outlined">arrow_upward</span>
        </button>

        <!-- MODAL -->
        <div id="newsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle"></h2>
                    <button class="modal-close" onclick="closeModal()">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="modal-body">
                    <img id="modalImage" class="modal-image" src="" alt="" onerror="this.style.display='none'">
                    <div id="modalDate" class="modal-date"></div>
                    <div id="modalDetail" class="modal-detail"></div>
                    <div class="modal-link-container">
                        <a id="modalLink" href="#" target="_blank" rel="noopener noreferrer" class="modal-link">
                            <span class="material-symbols-outlined">open_in_new</span>
                            Baca Selengkapnya
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <div>© 2026 MrxH Mods · Real-time Update System · All rights reserved</div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";

        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBfXJNWEFCZPXOuXF98IBmfkBKERADL0kg",
            authDomain: "linktree-8a6ad.firebaseapp.com",
            projectId: "linktree-8a6ad",
            storageBucket: "linktree-8a6ad.firebasestorage.app",
            messagingSenderId: "1037584366190",
            appId: "1:1037584366190:web:93f409e51e791cc6eb847f",
            measurementId: "G-F8F65QB3HT"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // ========== GLOBAL VARIABLES ==========
        let allLinks = [];
        let currentFilter = 'all';
        let unsubscribeLinks = null;
        let unsubscribeInfo = null;
        let unsubscribeProfile = null;

        // ========== HELPER FUNCTIONS ==========
        function showToast(message, icon = 'info') {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<span class="material-symbols-outlined">${icon}</span> ${message}`;
            toast.style.display = 'flex';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function formatRelativeTime(timestamp) {
            if (!timestamp) return 'Just now';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const diff = Math.floor((Date.now() - date) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return `${Math.floor(diff / 86400)}d ago`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Sort by latest updatedAt (edited items go to TOP)
        function sortLinksByLatestEdit(links) {
            return [...links].sort((a, b) => {
                const dateA = a.updatedAt?.toDate ? a.updatedAt.toDate() : (a.createdAt?.toDate() || new Date(0));
                const dateB = b.updatedAt?.toDate ? b.updatedAt.toDate() : (b.createdAt?.toDate() || new Date(0));
                return dateB - dateA;
            });
        }

        // ========== RENDER LINKS ==========
        function renderLinks(links) {
            const container = document.getElementById('linksContainer');
            let filtered = [...links];
            
            if (currentFilter === 'popular') {
                filtered = filtered.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
            } else if (currentFilter === 'new') {
                filtered = filtered.sort((a, b) => {
                    const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
                    const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
                    return dateB - dateA;
                });
            } else {
                filtered = sortLinksByLatestEdit(links);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">apk_install</span><h3>No APK Available</h3><p>Check back later for new uploads</p></div>`;
                document.getElementById('apkCount').textContent = '0';
                return;
            }

            let html = '';
            filtered.forEach(link => {
                const isRecentlyUpdated = link.updatedAt && (Date.now() - (link.updatedAt.toDate?.() || 0) < 60000);
                const updatedTime = link.updatedAt ? formatRelativeTime(link.updatedAt) : (link.createdAt ? formatRelativeTime(link.createdAt) : 'Recently');
                
                html += `
                    <div class="apk-card ${isRecentlyUpdated ? 'recent-update' : ''}">
                        <div class="apk-header">
                            <img src="${link.icon || 'https://via.placeholder.com/70'}" class="apk-icon" onerror="this.src='https://via.placeholder.com/70'">
                            <div class="apk-info">
                                <div class="apk-title">
                                    ${escapeHtml(link.title || 'Untitled')}
                                    <span class="apk-version"><span class="material-symbols-outlined">tag</span> ${escapeHtml(link.version || 'v1.0.0')}</span>
                                </div>
                                ${isRecentlyUpdated ? '<div class="update-badge"><span class="material-symbols-outlined">update</span> Just updated!</div>' : ''}
                            </div>
                        </div>
                        <div class="apk-description">${escapeHtml(link.description || 'No description available.')}</div>
                        <div class="apk-meta">
                            <span><span class="material-symbols-outlined">storage</span> ${escapeHtml(link.size || '~ MB')}</span>
                            <span class="download-count"><span class="material-symbols-outlined">download</span> ${formatNumber(link.downloads || 0)}</span>
                            <span><span class="material-symbols-outlined">schedule</span> ${updatedTime}</span>
                        </div>
                        ${link.detail ? `<div class="apk-detail" style="font-size:12px; color:var(--neon-primary); margin-bottom:12px;"><span class="material-symbols-outlined">info</span> ${escapeHtml(link.detail)}</div>` : ''}
                        <a href="#" onclick="handleDownload('${link.id}', '${escapeHtml(link.url)}'); return false;" class="download-btn">
                            <span class="material-symbols-outlined">download</span> Download APK
                        </a>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('apkCount').textContent = filtered.length;
            document.getElementById('sortInfo').innerHTML = currentFilter === 'all' ? 'Latest edits first ✓' : (currentFilter === 'popular' ? 'Sorted by popularity' : 'Sorted by newest');
        }

        // ========== FILTER FUNCTIONS ==========
        window.filterItems = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.apk-card');
            let visible = 0;
            cards.forEach(card => {
                const title = card.querySelector('.apk-title')?.textContent.toLowerCase() || '';
                if (title.includes(searchTerm)) {
                    card.style.display = 'flex';
                    visible++;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('apkCount').textContent = visible;
        };

        window.filterByCategory = function(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderLinks(allLinks);
            setTimeout(() => filterItems(), 50);
        };

        // ========== DOWNLOAD HANDLER ==========
        window.handleDownload = async function(linkId, url) {
            try {
                const linkRef = doc(db, 'links', linkId);
                await updateDoc(linkRef, { downloads: increment(1), lastDownloaded: new Date() });
                showToast('Download started! +1 download', 'download');
                setTimeout(() => window.open(url, '_blank'), 300);
            } catch (error) {
                window.open(url, '_blank');
            }
        };

        // ========== PROFILE LISTENER ==========
        function listenToProfile() {
            const profileRef = doc(db, 'settings', 'profile');
            unsubscribeProfile = onSnapshot(profileRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('profileName').textContent = data.name || 'MrxH Mods';
                    document.getElementById('profileBio').textContent = data.bio || 'Professional Mod Menu Games platform with real-time updates.';
                    if (data.profileImage) document.getElementById('profileImage').src = data.profileImage;
                    document.getElementById('verifiedBadge').style.display = data.verified ? 'flex' : 'none';
                }
            });
        }

        // ========== LINKS LISTENER (REAL-TIME) ==========
        function listenToLinks() {
            if (unsubscribeLinks) unsubscribeLinks();
            const linksRef = collection(db, 'links');
            const q = query(linksRef, orderBy('order', 'asc'));
            
            unsubscribeLinks = onSnapshot(q, (snapshot) => {
                const links = [];
                snapshot.forEach(doc => {
                    links.push({ id: doc.id, ...doc.data() });
                });
                allLinks = links;
                renderLinks(allLinks);
                setTimeout(() => filterItems(), 50);
                
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'modified') {
                        showToast(`✨ "${change.doc.data().title}" has been updated!`, 'update');
                    } else if (change.type === 'added') {
                        showToast(`🎉 New APK: ${change.doc.data().title}`, 'new_releases');
                    }
                });
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            });
        }

        // ========== NEWS LISTENER ==========
        function listenToInfoPosts() {
            if (unsubscribeInfo) unsubscribeInfo();
            const infoRef = collection(db, 'infoPosts');
            const q = query(infoRef, orderBy('createdAt', 'desc'));
            
            unsubscribeInfo = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('infoPostsContainer');
                document.getElementById('newsCount').textContent = snapshot.size;
                
                if (snapshot.empty) {
                    container.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">newspaper</span><h3>No News Available</h3><p>Check back later for updates</p></div>`;
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const post = { id: doc.id, ...doc.data() };
                    const date = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleDateString('id-ID') : '';
                    const postData = JSON.stringify(post).replace(/"/g, '&quot;');
                    html += `
                        <div class="news-card" onclick='openModal(${postData})'>
                            <div class="news-badge"><span class="material-symbols-outlined">new_releases</span> UPDATE</div>
                            <div class="news-title">${escapeHtml(post.title || 'Untitled')}</div>
                            <div class="news-detail">${escapeHtml((post.detail || '').substring(0, 100))}${(post.detail || '').length > 100 ? '...' : ''}</div>
                            <div class="news-footer">
                                <div class="news-date"><span class="material-symbols-outlined">calendar_month</span> ${date}</div>
                                <span class="read-more">Read More →</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        // ========== MODAL FUNCTIONS ==========
        window.openModal = function(postData) {
            document.getElementById('modalTitle').textContent = postData.title || 'Detail';
            document.getElementById('modalDetail').textContent = postData.detail || '';
            if (postData.image) {
                document.getElementById('modalImage').src = postData.image;
                document.getElementById('modalImage').style.display = 'block';
            } else {
                document.getElementById('modalImage').style.display = 'none';
            }
            const date = postData.createdAt ? new Date(postData.createdAt.seconds * 1000).toLocaleString('id-ID') : '';
            document.getElementById('modalDate').innerHTML = `<span class="material-symbols-outlined">calendar_month</span> ${date}`;
            const linkBtn = document.getElementById('modalLink');
            if (postData.link) {
                linkBtn.href = postData.link;
                linkBtn.style.display = 'inline-flex';
            } else {
                linkBtn.style.display = 'none';
            }
            document.getElementById('newsModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = function() {
            document.getElementById('newsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        window.scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // ========== INITIALIZATION ==========
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('id-ID', { 
            weekday: 'short', 
            year: 'numeric', 
            month: 'short', 
            day: 'numeric' 
        });
        
        window.onclick = (e) => { if (e.target === document.getElementById('newsModal')) closeModal(); };
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
        
        // Start all listeners
        listenToProfile();
        listenToLinks();
        listenToInfoPosts();
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (unsubscribeLinks) unsubscribeLinks();
            if (unsubscribeInfo) unsubscribeInfo();
            if (unsubscribeProfile) unsubscribeProfile();
        });
    </script>
</body>
</html>
